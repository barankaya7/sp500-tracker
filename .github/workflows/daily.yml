name: daily-ingest
on:
  schedule:
    - cron: "30 21 * * 1-5"   # ABD kapanış sonrası (21:30 UTC = 00:30 TR)
  workflow_dispatch:
    inputs:
      full_prices:
        description: "1 yıllık fiyat geçmişini yeniden çek"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Universe (S&P 500 listesi)
        run: python ingest/universe.py
      - name: Prices (EOD)
        run: python ingest/prices.py ${{ inputs.full_prices && '--full' || '' }}
      - name: Fundamentals + earnings
        run: python ingest/fundamentals.py
      - name: Whales (13F)
        run: python ingest/whales13f.py
        continue-on-error: true
      - name: Congress trades
        run: python ingest/congress.py
        continue-on-error: true
      - name: News
        run: python ingest/news.py
        continue-on-error: true
      - name: Scores
        run: python ingest/scores.py
      - name: Quotes snapshot
        run: python ingest/quotes.py
      - name: Prune old data
        run: python ingest/prune.py

name: intraday
on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # ABD piyasa saatleri (UTC)
  workflow_dispatch:

concurrency:
  group: intraday
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt
      - run: pip install -r ingest/requirements.txt
      - name: Quotes + hareket alarmları
        run: python ingest/quotes.py
        continue-on-error: true
      - name: Form 4 (insider) poll
        run: python ingest/form4.py
